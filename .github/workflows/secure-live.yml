name: Secure live profile
on: [push, pull_request]
jobs:
  security-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m unittest discover -s tests -p 'test_secure*.py' -v
      - run: npm ci --ignore-scripts && npm test && npm audit --audit-level=high
        working-directory: secure-addin
      - run: docker build -t word-ai-secure:test .
