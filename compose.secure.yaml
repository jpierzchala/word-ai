name: word-ai-secure
services:
  word-ai:
    image: word-ai-secure:local
    build: .
    container_name: word-ai-secure
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    ulimits:
      core: {soft: 0, hard: 0}
      nofile: {soft: 512, hard: 512}
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - type: volume
        source: secrets
        target: /secrets
        read_only: true
    tmpfs:
      - /run/word-ai:rw,noexec,nosuid,size=1m,uid=10001,gid=10001,mode=0700
    logging:
      driver: local
      options: {max-size: 1m, max-file: "2"}
volumes:
  secrets:
    name: word-ai-secure-secrets
    external: true
